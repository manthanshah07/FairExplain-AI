name: FairExplain AI CI Pipeline

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
    branches: [main]

jobs:
  backend-domain-tests:
    name: Backend Unit & Domain Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run Domain Pure Unit Tests
        working-directory: ./backend
        run: |
          PYTHONPATH=. python3 -m unittest discover -s tests/unit -p "test_*.py"

  backend-integration-tests:
    name: Backend Integration Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: fairexplain
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: fairexplain_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run Database Migrations
        working-directory: ./backend
        env:
          DATABASE_URL: postgresql+asyncpg://fairexplain:test_password@localhost:5432/fairexplain_test
        run: |
          alembic upgrade head

      - name: Run Pytest Integration Suite
        working-directory: ./backend
        env:
          APP_ENV: development
          DATABASE_URL: postgresql+asyncpg://fairexplain:test_password@localhost:5432/fairexplain_test
          SECRET_KEY: test-secret-key-for-ci-pipeline-only
          ALLOWED_ORIGINS: '["http://localhost:5173", "http://localhost:3000"]'
        run: |
          pytest tests -v

  frontend-ci:
    name: Frontend Lint & Production Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Lint and Typecheck
        working-directory: ./frontend
        run: |
          npm run lint
          npm run build
