services:
  postgres-test:
    image: postgres:16-alpine
    container_name: fairexplain-postgres-test
    environment:
      POSTGRES_USER: fairexplain_test
      POSTGRES_PASSWORD: test_secure_password_123
      POSTGRES_DB: fairexplain_test_db
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fairexplain_test -d fairexplain_test_db"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio-test:
    image: minio/minio:RELEASE.2024-01-01T00-00-00Z
    container_name: fairexplain-minio-test
    environment:
      MINIO_ROOT_USER: minio_test_user
      MINIO_ROOT_PASSWORD: minio_test_password_123
    ports:
      - "9000:9000"
      - "9001:9001"
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio-init:
    image: minio/mc:RELEASE.2024-01-01T00-00-00Z
    container_name: fairexplain-minio-init
    depends_on:
      minio-test:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      /usr/bin/mc alias set myminio http://minio-test:9000 minio_test_user minio_test_password_123;
      /usr/bin/mc mb myminio/fairexplain-test-bucket;
      /usr/bin/mc anonymous set none myminio/fairexplain-test-bucket;
      exit 0;
      "
